<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | web_ar_gps</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=480 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-container">
        <div id="loading-bar">
          <div id="circle-spinner"></div>
          <div id="progress-bar-empty">
            <div id="progress-bar-full"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="Build/docs.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingContainer = document.querySelector("#unity-loading-container");
      var progressBarFull = document.querySelector("#progress-bar-full");


      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/docs.data.unityweb",
        frameworkUrl: "Build/docs.framework.js.unityweb",
        codeUrl: "Build/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Urrego",
        productName: "web_ar_gps",
        productVersion: "0.1.66",
        webglContextAttributes: {
            alpha: false,
            preserveDrawingBuffer: false,
            powerPreference: "high-performance"
        }

      }, (progress) => {
        if (progress < 1) {
          loadingContainer.style.display = "block";
          progressBarFull.style.width = (100 * progress) + "%";
        } else {
          loadingContainer.style.display = "none";
        }
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
